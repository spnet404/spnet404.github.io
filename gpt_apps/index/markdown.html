<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VSCode Style Markdown Editor</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Consolas", "Courier New", monospace;
}

body {
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: #1e1e1e;
  color: #d4d4d4;
}

/* Top Bar */
header {
  height: 40px;
  background: #252526;
  display: flex;
  align-items: center;
  padding: 0 15px;
  font-size: 14px;
  border-bottom: 1px solid #333;
  color: #9cdcfe;
}

/* Layout */
.main {
  flex: 1;
  display: flex;
}

/* Sidebar */
.sidebar {
  width: 220px;
  background: #252526;
  border-right: 1px solid #333;
  padding-top: 10px;
}

.sidebar h3 {
  font-size: 12px;
  padding: 10px 15px;
  color: #888;
}

.file {
  padding: 8px 20px;
  cursor: pointer;
  font-size: 14px;
}

.file:hover {
  background: #37373d;
}

.file.active {
  background: #094771;
}

/* Editor Area */
.container {
  flex: 1;
  display: flex;
}

.editor, .preview {
  width: 50%;
  padding: 20px;
  overflow-y: auto;
}

.editor {
  border-right: 1px solid #333;
}

textarea {
  width: 100%;
  height: 100%;
  background: transparent;
  border: none;
  resize: none;
  outline: none;
  color: #d4d4d4;
  font-size: 14px;
  line-height: 1.6;
}

/* Preview Styling */
.preview h1, .preview h2, .preview h3 {
  color: #569cd6;
  margin-top: 20px;
}

.preview p {
  margin: 10px 0;
}

.preview code {
  background: #2d2d2d;
  padding: 3px 6px;
  border-radius: 4px;
  color: #ce9178;
}

.preview pre {
  background: #252526;
  padding: 15px;
  border-radius: 6px;
  overflow-x: auto;
  color: #dcdcaa;
}

.preview blockquote {
  border-left: 4px solid #569cd6;
  padding-left: 10px;
  margin: 10px 0;
  color: #9cdcfe;
}

/* Footer */
footer {
  height: 25px;
  background: #007acc;
  font-size: 12px;
  display: flex;
  align-items: center;
  padding-left: 15px;
  color: white;
}

@media (max-width: 768px) {
  .main {
    flex-direction: column;
  }
  .sidebar {
    width: 100%;
    display: flex;
  }
  .container {
    flex-direction: column;
  }
  .editor, .preview {
    width: 100%;
    height: 50%;
  }
}
</style>
</head>

<body>

<header>markdown.md</header>

<div class="main">
  <div class="sidebar">
    <h3>EXPLORER</h3>
    <div class="file active" data-file="markdown1">markdown.md</div>
    <div class="file" data-file="markdown2">notes.md</div>
    <div class="file" data-file="markdown3">draft.md</div>
  </div>

  <div class="container">
    <div class="editor">
      <textarea id="markdownInput"></textarea>
    </div>
    <div class="preview" id="preview"></div>
  </div>
</div>

<footer>VSCode風 Markdown Editor</footer>

<script>
const input = document.getElementById("markdownInput");
const preview = document.getElementById("preview");
const files = document.querySelectorAll(".file");

let currentFile = "markdown1";

function getKey(file) {
  return "vscode_md_" + file;
}

function loadFile(file) {
  currentFile = file;
  const saved = localStorage.getItem(getKey(file));
  input.value = saved || `# ${file}\n\n見本`;
  updatePreview();
}

function updatePreview() {
  preview.innerHTML = marked.parse(input.value);
  localStorage.setItem(getKey(currentFile), input.value);
}

input.addEventListener("input", updatePreview);

files.forEach(file => {
  file.addEventListener("click", () => {
    document.querySelector(".file.active").classList.remove("active");
    file.classList.add("active");
    loadFile(file.dataset.file);
  });
});

loadFile(currentFile);
</script>

</body>
</html>
