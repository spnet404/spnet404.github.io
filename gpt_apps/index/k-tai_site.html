<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>☆YUUKIの部屋☆</title>
<style>
body {
  font-family: "MS PGothic", sans-serif;
  margin: 0;
  padding: 0;

  /* 青グラデーション（タイル風） */
  background: linear-gradient(#e6f0ff, #b3d1ff);
  background-size: 20px 20px;
}

.container {
  width: 320px;
  margin: 10px auto;
  border: 2px solid #3366cc;
  padding: 10px;
  background-color: #ffffff;
}

h1 {
  font-size: 16px;
  text-align: center;
  background: linear-gradient(#6699ff, #3366cc);
  color: #fff;
  padding: 5px;
  border: 1px solid #003399;
}

.section {
  margin-top: 10px;
  border-top: 1px dashed #3366cc;
  padding-top: 5px;
}

a {
  color: #0033cc;
  text-decoration: underline;
}

.marquee {
  background: linear-gradient(#ffffff, #cce0ff);
  font-size: 12px;
  padding: 3px;
  border: 1px solid #3366cc;
  overflow: hidden;
  white-space: nowrap;
  animation: scroll 10s linear infinite;
}

@keyframes scroll {
  0% { text-indent: 100%; }
  100% { text-indent: -100%; }
}

.footer {
  text-align: center;
  font-size: 10px;
  margin-top: 15px;
  color: #333;
}
</style>
</head>

<body>

<div class="container">

  <h1>☆えすぴーねっとの部屋へようこそ☆</h1>

  <div class="marquee">
    ＼(＾o＾)／ キリ番GETした人はBBSにカキコしてね！
  </div>

  <div class="section">
    <b>◆プロフィール◆</b><br>
    名前：えすぴーねっと<br>
    性別：男<br>
    趣味：写真・ガジェット・ネット探索<br>
    好き：レトロなウェブ文化 / ブラウザ<br>
  </div>

  <div class="section">
    <b>◆ひとこと◆</b><br>
    私の個人サイトです<br>
    ゆっくりしていってね！！
  </div>

  <div class="section">
    <b>◆リンク◆</b><br>
    ・<a href="#">日記</a><br>
    ・<a href="#">掲示板（BBS）</a><br>
    ・<a href="#">メール送信</a><br>
  </div>

  <div class="section">
    <b>◆カウンター◆</b><br>
    あなたは <b>1234</b> 人目の訪問者です！
  </div>

  <div class="footer">
    <hr>
    since 2005<br>
    無断転載は禁止だよ！
  </div>

</div>

</body>
</html>
