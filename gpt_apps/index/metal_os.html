<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Metal OS</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  height:100vh;
  background:linear-gradient(135deg,#dfe9f3,#ffffff);
  display:flex;
  align-items:center;
  justify-content:center;
}

.window{
  width:900px;
  height:550px;
  border-radius:18px;
  backdrop-filter:blur(30px);
  background:rgba(255,255,255,0.65);
  box-shadow:0 25px 60px rgba(0,0,0,0.15);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.header{
  height:48px;
  display:flex;
  align-items:center;
  padding:0 15px;
  background:rgba(255,255,255,0.5);
  border-bottom:1px solid rgba(0,0,0,0.05);
}

.window-buttons{
  display:flex;
  gap:8px;
  margin-right:15px;
}

.window-buttons span{
  width:12px;
  height:12px;
  border-radius:50%;
}

.red{background:#ff5f57;}
.yellow{background:#febc2e;}
.green{background:#28c840;}

.path{
  font-size:14px;
  color:#555;
  transition:0.3s;
}

.body{
  flex:1;
  display:flex;
}

.sidebar{
  width:220px;
  background:rgba(255,255,255,0.5);
  border-right:1px solid rgba(0,0,0,0.05);
  padding:15px;
}

.sidebar div{
  padding:6px 8px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
}

.sidebar div:hover{
  background:rgba(0,0,0,0.05);
}

.files{
  flex:1;
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:20px;
  position:relative;
  overflow:hidden;
}

.file{
  text-align:center;
  cursor:pointer;
  transition:0.2s;
}

.file:hover{
  transform:translateY(-4px);
}

.file-icon{
  width:70px;
  height:70px;
  margin:0 auto 8px;
  border-radius:16px;
  background:linear-gradient(145deg,#f2f2f2,#ffffff);
  box-shadow:0 6px 15px rgba(0,0,0,0.1);
}

.folder{
  background:linear-gradient(145deg,#ffe8a3,#ffd86b);
}

.file-name{
  font-size:13px;
  color:#333;
}

/* アニメーション */
.fade-out{
  animation:fadeOut 0.25s forwards;
}

.fade-in{
  animation:fadeIn 0.35s forwards;
}

@keyframes fadeOut{
  to{
    opacity:0;
    transform:scale(0.96);
  }
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:scale(1.05);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.back-btn{
  position:absolute;
  top:10px;
  right:15px;
  font-size:13px;
  cursor:pointer;
  color:#007aff;
}
</style>
</head>
<body>

<div class="window">
  <div class="header">
    <div class="window-buttons">
      <span class="red"></span>
      <span class="yellow"></span>
      <span class="green"></span>
    </div>
    <div class="path" id="path">/Users/example/Documents</div>
  </div>

  <div class="body">
    <div class="sidebar">
      <div>📁 Desktop</div>
      <div>📁 Documents</div>
      <div>📁 Downloads</div>
    </div>

    <div class="files" id="files">
      <div class="file" onclick="openFolder('Project')">
        <div class="file-icon folder"></div>
        <div class="file-name">Project</div>
      </div>

      <div class="file">
        <div class="file-icon"></div>
        <div class="file-name">Photo.png</div>
      </div>

      <div class="file">
        <div class="file-icon"></div>
        <div class="file-name">Notes.txt</div>
      </div>
    </div>
  </div>
</div>

<script>
const filesArea = document.getElementById("files");
const path = document.getElementById("path");

function openFolder(name){
  filesArea.classList.add("fade-out");

  setTimeout(()=>{
    filesArea.innerHTML = `
      <div class="back-btn" onclick="goBack()">← Back</div>

      <div class="file">
        <div class="file-icon"></div>
        <div class="file-name">index.html</div>
      </div>

      <div class="file">
        <div class="file-icon"></div>
        <div class="file-name">style.css</div>
      </div>

      <div class="file">
        <div class="file-icon"></div>
        <div class="file-name">script.js</div>
      </div>
    `;

    path.textContent += "/" + name;

    filesArea.classList.remove("fade-out");
    filesArea.classList.add("fade-in");
  },250);
}

function goBack(){
  filesArea.classList.add("fade-out");

  setTimeout(()=>{
    filesArea.innerHTML = `
      <div class="file" onclick="openFolder('Project')">
        <div class="file-icon folder"></div>
        <div class="file-name">Project</div>
      </div>

      <div class="file">
        <div class="file-icon"></div>
        <div class="file-name">Photo.png</div>
      </div>

      <div class="file">
        <div class="file-icon"></div>
        <div class="file-name">Notes.txt</div>
      </div>
    `;

    path.textContent = "/Users/YUUKI/Documents";

    filesArea.classList.remove("fade-out");
    filesArea.classList.add("fade-in");
  },250);
}
</script>

</body>
</html>
