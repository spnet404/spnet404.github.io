<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1365 Start</title>
<style>
body {
  margin: 0;
  font-family: "MS PGothic", sans-serif;
  background: #e6ecf5;
}

/* ヘッダー */
.header {
  background: linear-gradient(#2b6cb0, #1a4e8a);
  color: white;
  padding: 10px;
  font-size: 22px;
  font-weight: bold;
}

/* ナビ */
.nav {
  background: #d9e4f5;
  padding: 8px;
  border-bottom: 1px solid #aaa;
}

.nav a {
  margin-right: 10px;
  text-decoration: none;
  color: #003366;
  font-size: 14px;
}

/* レイアウト */
.container {
  display: grid;
  grid-template-columns: 220px 1fr 260px;
  gap: 10px;
  padding: 10px;
}

.box {
  background: white;
  border: 1px solid #aaa;
}

.box-header {
  background: #c3d9ff;
  padding: 5px;
  font-size: 14px;
  font-weight: bold;
  border-bottom: 1px solid #aaa;
}

.box-content {
  padding: 8px;
  font-size: 13px;
}

/* リスト */
.box-content ul {
  padding-left: 15px;
}

.box-content li {
  margin-bottom: 4px;
}

/* 検索 */
.search {
  text-align: center;
  margin: 10px;
}

.search input {
  width: 60%;
  padding: 6px;
  border: 1px solid #888;
}

.search button {
  padding: 6px 10px;
  background: #2b6cb0;
  color: white;
  border: none;
}

/* フッター */
.footer {
  text-align: center;
  font-size: 12px;
  color: #666;
  padding: 10px;
}
</style>
</head>
<body>

<div class="header">1365 Start</div>

<div class="nav">
  <a href="#">ニュース</a>
  <a href="#">動画</a>
  <a href="#">掲示板</a>
  <a href="#">ゲーム</a>
  <a href="#">メール</a>
  <a href="#">ブログ</a>
</div>

<div class="search">
  <input type="text" placeholder="キーワード検索">
  <button>検索</button>
</div>

<div class="container">

  <!-- 左カラム -->
  <div>
    <div class="box">
      <div class="box-header">カテゴリ</div>
      <div class="box-content">
        <ul>
          <li>IT・テクノロジー</li>
          <li>エンタメ</li>
          <li>スポーツ</li>
          <li>社会</li>
          <li>国際</li>
        </ul>
      </div>
    </div>

    <div class="box">
      <div class="box-header">人気サービス</div>
      <div class="box-content">
        <ul>
          <li>チャット</li>
          <li>掲示板</li>
          <li>ファイル共有</li>
          <li>ブログ</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- 中央 -->
  <div>
    <div class="box">
      <div class="box-header">トップニュース</div>
      <div class="box-content">
        <ul>
          <li>大型アップデート発表</li>
          <li>新SNSサービス登場</li>
          <li>人気ゲーム最新情報</li>
          <li>通信速度の新記録</li>
        </ul>
      </div>
    </div>

    <div class="box">
      <div class="box-header">おすすめコンテンツ</div>
      <div class="box-content">
        ポータルサイト風UI
      </div>
    </div>
  </div>

  <!-- 右カラム -->
  <div>
    <div class="box">
      <div class="box-header">ログイン</div>
      <div class="box-content">
        <input type="text" placeholder="ID"><br><br>
        <input type="password" placeholder="パスワード"><br><br>
        <button>ログイン</button>
      </div>
    </div>

    <div class="box">
      <div class="box-header">広告</div>
      <div class="box-content">
        <img src="#" alt="広告">
      </div>
    </div>
  </div>

</div>

<div class="footer">
  © spnet_404.
</div>

</body>
</html>
