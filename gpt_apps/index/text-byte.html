<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Counter</title>

<style>
body {
    margin: 0;
    background: #ececec;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* ウィンドウ */
.window {
    background: #ffffff;
    width: 620px;
    max-width: 92%;
    border-radius: 14px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.12);
    overflow: hidden;
}

/* タイトルバー */
.titlebar {
    height: 40px;
    background: #f5f5f7;
    display: flex;
    align-items: center;
    padding: 0 14px;
    border-bottom: 1px solid #e5e5e7;
}

.dots {
    display: flex;
    gap: 8px;
}

.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
}

.red { background: #ff5f57; }
.yellow { background: #febc2e; }
.green { background: #28c840; }

/* コンテンツ */
.content {
    padding: 30px;
}

textarea {
    width: 100%;
    height: 180px;
    border: none;
    resize: none;
    font-size: 15px;
    outline: none;
    line-height: 1.6;
}

/* カウンター */
.result {
    margin-top: 25px;
    display: flex;
    gap: 40px;
}

.counter {
    flex: 1;
    text-align: left; /* ← 左揃え固定 */
}

.label {
    font-size: 12px;
    color: #888;
    margin-bottom: 4px;
}

.number {
    font-size: 34px;
    font-weight: 600;
    color: #111;
    letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="window">
    <div class="titlebar">
        <div class="dots">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>
    </div>

    <div class="content">
        <textarea id="textInput" placeholder="Type something..."></textarea>

        <div class="result">
            <div class="counter">
                <div class="label">Characters</div>
                <div class="number" id="charCount">0</div>
            </div>

            <div class="counter">
                <div class="label">Bytes (UTF-8)</div>
                <div class="number" id="byteCount">0</div>
            </div>
        </div>
    </div>
</div>

<script>
const textarea = document.getElementById("textInput");
const charCount = document.getElementById("charCount");
const byteCount = document.getElementById("byteCount");

function updateCount() {
    const text = textarea.value;
    charCount.textContent = text.length;

    const encoder = new TextEncoder();
    const bytes = encoder.encode(text);
    byteCount.textContent = bytes.length;
}

textarea.addEventListener("input", updateCount);
</script>

</body>
</html>
