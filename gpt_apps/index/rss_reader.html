<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>News Gate i</title>
<style>
body {
    background:#e5e5e5;
    font-family:"MS PGothic", monospace;
    font-size:14px;
}
.container {
    width:360px;
    margin:20px auto;
    background:#fff;
    border:1px solid #999;
}
.header {
    background:#000080;
    color:#fff;
    padding:5px;
    font-weight:bold;
}
.tabs {
    background:#f0f0f0;
    border-bottom:1px solid #ccc;
    padding:3px;
}
.tab {
    display:inline-block;
    padding:3px 6px;
    margin-right:3px;
    background:#ddd;
    cursor:pointer;
    font-size:12px;
}
.tab.active {
    background:#fff;
    border:1px solid #999;
    border-bottom:none;
}
.menu {
    padding:5px;
    border-bottom:1px solid #ccc;
    background:#f8f8f8;
}
.menu input {
    width:95%;
    font-size:12px;
}
.news {
    padding:5px;
}
.item {
    border-bottom:1px dotted #999;
    padding:5px 0;
}
.item a {
    color:#0000ee;
    text-decoration:none;
}
.item a:hover {
    text-decoration:underline;
}
.footer {
    background:#f8f8f8;
    font-size:12px;
    padding:5px;
    border-top:1px solid #ccc;
}
.small {
    font-size:12px;
    color:#555;
}
</style>
</head>
<body>

<div class="container">
<div class="header">NEWS GATE i</div>

<div class="tabs" id="tabs"></div>

<div class="menu">
RSS追加:<br>
<input type="text" id="rssUrl" placeholder="https://example.com/rss.xml">
<button onclick="addFeed()">追加</button>
</div>

<div class="news" id="newsArea">
<div class="small">▼ニュース一覧</div>
</div>

<div class="footer">
最終更新: <span id="updateTime">---</span><br>
(c) 2008 News Gate i
</div>
</div>

<script>
let feeds = [];
let currentFeed = 0;

function saveData() {
    localStorage.setItem("rssFeeds", JSON.stringify(feeds));
    localStorage.setItem("currentFeed", currentFeed);
}

function loadData() {
    const savedFeeds = localStorage.getItem("rssFeeds");
    const savedCurrent = localStorage.getItem("currentFeed");

    if(savedFeeds) feeds = JSON.parse(savedFeeds);
    if(savedCurrent) currentFeed = parseInt(savedCurrent);

    if(feeds.length > 0) {
        renderTabs();
        loadRSS(feeds[currentFeed]);
    }
}

function renderTabs() {
    const tabs = document.getElementById("tabs");
    tabs.innerHTML = "";

    feeds.forEach((feed, index) => {
        const tab = document.createElement("span");
        tab.className = "tab" + (index === currentFeed ? " active" : "");
        tab.textContent = "SITE" + (index + 1);
        tab.onclick = () => {
            currentFeed = index;
            saveData();
            renderTabs();
            loadRSS(feeds[index]);
        };
        tabs.appendChild(tab);
    });
}

function addFeed() {
    const url = document.getElementById("rssUrl").value;
    if(!url) return;

    feeds.push(url);
    currentFeed = feeds.length - 1;

    saveData();
    renderTabs();
    loadRSS(url);

    document.getElementById("rssUrl").value = "";
}

async function loadRSS(url) {
    const newsArea = document.getElementById("newsArea");
    newsArea.innerHTML = "読込中...";

    try {
        const response = await fetch(
            "https://api.allorigins.win/get?url=" +
            encodeURIComponent(url)
        );
        const data = await response.json();

        const parser = new DOMParser();
        const xml = parser.parseFromString(data.contents, "text/xml");

        const items = xml.querySelectorAll("item");
        newsArea.innerHTML = '<div class="small">▼ニュース一覧</div>';

        items.forEach((item, index) => {
            if(index >= 10) return;

            const title = item.querySelector("title")?.textContent;
            const link = item.querySelector("link")?.textContent;
            const pubDate = item.querySelector("pubDate")?.textContent;

            newsArea.innerHTML += `
                <div class="item">
                    <a href="${link}" target="_blank">■ ${title}</a><br>
                    <span class="small">${pubDate}</span>
                </div>
            `;
        });

        document.getElementById("updateTime").textContent =
            new Date().toLocaleString();

    } catch(e) {
        newsArea.innerHTML = "読込エラー";
    }
}

window.onload = loadData;
</script>

</body>
</html>
